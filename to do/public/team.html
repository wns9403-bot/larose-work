/* ── 상태 토글 ── */
function cycleStatus(id){
  const t=tasks.find(x=>x.id===id);if(!t)return;
  const order=["대기","진행중","완료"];
  t.status=order[(order.indexOf(t.status)+1)%3];
  if(t.status==="완료")t.progress=100;
  else if(t.status==="대기")t.progress=0;
  t.rechecked=false;
  t.updated_at=Date.now();
  upsertTask(t);render();
}
function recheckTask(id){
  const t=tasks.find(x=>x.id===id);if(!t||t.status!=="완료")return;
  t.rechecked=!t.rechecked;
  t.rechecked_at=t.rechecked?Date.now():null;
  t.updated_at=Date.now();
  upsertTask(t);render();
}

/* ── 업무 모달 ── */
function buildStoreOptions(){
  const dl=document.getElementById("storeOptions");
  if(!dl)return;
  const assignee=document.getElementById("f_assignee")?.value||"";
  let list=storeCatalog().filter(s=>s.owner===assignee);
  if(!list.length)list=storeCatalog();
  dl.innerHTML=list.map(s=>`<option value="${esc(s.name)}"></option>`).join("");
}
function updateStoreHint(){
  const el=document.getElementById("f_store");
  const hint=document.getElementById("storeHint");
  if(!el||!hint)return;
  const name=cleanStore(el.value);
  const s=storeInfo(name);
  hint.textContent=s.name?`담당 ${s.owner||"미지정"} · 파트장 ${s.partLead||"미지정"}`:"";
}
function openModal(t){
  document.getElementById("taskOverlay").classList.add("show");
  document.getElementById("modalTitle").textContent=t?"업무 수정":"업무 추가";
  document.getElementById("delBtn").style.display=t?"inline-flex":"none";
  document.getElementById("f_id").value=t?t.id:"";
  document.getElementById("f_title").value=t?t.title:"";
  document.getElementById("f_status").value=t?t.status:"대기";
  document.getElementById("f_due").value=t?(t.due_date||""):"";
  const prog=t?(t.progress||0):0;
  document.getElementById("f_progress").value=prog;
  document.getElementById("progVal").textContent=prog+"%";
  const as=document.getElementById("f_assignee");
  as.innerHTML=MEMBERS.map(m=>`<option ${(t?t.assignee:me)===m.name?"selected":""}>${esc(m.name)}</option>`).join("");
  buildStoreOptions();
  document.getElementById("f_store").value=t?(t.store||""):(storeFilter==="all"?"":storeFilter);
  updateStoreHint();
  const pcur=t?(t.priority||"중요"):"중요";
  document.getElementById("f_pri").innerHTML=PRIORITIES.map(p=>
    `<button class="p-opt ${p.key===pcur?"on":""}" data-pri="${p.key}" onclick="pickPri('${p.key}')">${p.label}</button>`).join("");
  const fcur=t?(t.freq||"비정기"):"비정기";
  document.getElementById("f_freq").innerHTML=FREQS.map(f=>
    `<button class="f-opt ${f.key===fcur?"on":""}" data-freq="${f.key}" onclick="pickFreq('${f.key}')">${f.label}</button>`).join("");
  setTimeout(()=>document.getElementById("f_title").focus(),80);
}
function pickPri(k){document.querySelectorAll(".p-opt").forEach(o=>o.classList.toggle("on",o.dataset.pri===k));}
function pickFreq(k){document.querySelectorAll(".f-opt").forEach(o=>o.classList.toggle("on",o.dataset.freq===k));}
function closeModal(){document.getElementById("taskOverlay").classList.remove("show");}
function editTask(id){const t=tasks.find(x=>x.id===id);if(t)openModal(t);}
function saveTask(){
  const title=document.getElementById("f_title").value.trim();
  if(!title){alert("업무명을 입력하세요.");return;}
  const id=document.getElementById("f_id").value||uid();
  const sp=document.querySelector(".p-opt.on");
  const sf=document.querySelector(".f-opt.on");
  const prev=tasks.find(x=>x.id===id);
  const newStatus=document.getElementById("f_status").value;
  upsertTask({id,title,
    assignee:document.getElementById("f_assignee").value,
    store:document.getElementById("f_store").value.trim()||"-",
    priority:sp?sp.dataset.pri:"중요",
    freq:sf?sf.dataset.freq:"비정기",
    status:newStatus,
    due_date:document.getElementById("f_due").value||null,
    progress:parseInt(document.getElementById("f_progress").value,10),
    created_at:prev&&prev.created_at?prev.created_at:Date.now(),
    rechecked:prev&&newStatus==="완료"&&prev.status==="완료"?(prev.rechecked||false):false,
    updated_at:Date.now(),
  });
  closeModal();render();
}
function deleteTask(){
  const id=document.getElementById("f_id").value;
  if(id&&confirm("이 업무를 삭제할까요?")){removeTask(id);closeModal();render();}
}

/* ── 매장 설정 모달 ── */
function storeRowHTML(s){
  const row=normalizeStoreRow(s);
  return`<div class="store-row" data-old="${esc(row.name)}">
    <input class="store-name" value="${esc(row.name)}" placeholder="매장명">
    <input class="store-part" value="${esc(row.partLead)}" placeholder="파트장 이름">
    <button class="store-row-remove" onclick="removeStoreRow(this)" title="삭제">×</button>
  </div>`;
}
function groupStoresByOwner(stores){
  const groups=[];
  stores.forEach(s=>{
    const key=s.owner||"";
    let g=groups.find(g=>g.owner===key);
    if(!g){g={owner:key,stores:[]};groups.push(g);}
    g.stores.push(s);
  });
  if(!groups.length)groups.push({owner:"",stores:[{name:"",partLead:""}]});
  return groups;
}
function storeGroupHTML(g){
  return`<div class="store-owner-group">
    <div class="store-group-head">
      <span class="store-group-icon">👤</span>
      <input class="store-group-owner" value="${esc(g.owner)}" placeholder="담당자명 입력">
      <span class="store-group-count">${g.stores.length}개 매장</span>
    </div>
    <div class="store-group-rows">${g.stores.map(storeRowHTML).join("")}</div>
    <button class="store-group-add" onclick="addStoreRowToGroup(this)">+ 매장 추가</button>
  </div>`;
}
function openStoreSettings(){
  const wrap=document.getElementById("storeSettingsRows");
  wrap.innerHTML=groupStoresByOwner(STORES).map(storeGroupHTML).join("");
  document.getElementById("storeSettingsOverlay").classList.add("show");
}
function closeStoreSettings(){document.getElementById("storeSettingsOverlay").classList.remove("show");}
function addStoreGroup(){
  document.getElementById("storeSettingsRows").insertAdjacentHTML("beforeend",
    storeGroupHTML({owner:"",stores:[{name:"",partLead:""}]}));
}
function addStoreRowToGroup(btn){
  const group=btn.closest(".store-owner-group");
  group.querySelector(".store-group-rows").insertAdjacentHTML("beforeend",storeRowHTML({name:"",owner:"",partLead:""}));
}
function removeStoreRow(btn){
  const row=btn.closest(".store-row");
  if(row)row.remove();
}
function saveStores(){
  const groups=[...document.querySelectorAll("#storeSettingsRows .store-owner-group")];
  const next=[];
  groups.forEach(group=>{
    const owner=cleanStore(group.querySelector(".store-group-owner").value);
    const rows=[...group.querySelectorAll(".store-row")];
    rows.forEach(row=>{
      const old=cleanStore(row.dataset.old);
      const name=cleanStore(row.querySelector(".store-name").value);
      const partLead=cleanStore(row.querySelector(".store-part").value);
      if(!name)return;
      if(old&&old!==name)tasks.forEach(t=>{if(cleanStore(t.store)===old)t.store=name;});
      if(!next.find(s=>s.name===name))next.push({name,owner,partLead});
    });
  });
  STORES=next;
  persistStores();
  saveLocal();
  if(storeFilter!=="all"&&!storeCatalog().find(s=>s.name===storeFilter))storeFilter="all";
  buildStoreOptions();
  closeStoreSettings();
  render();
}

/* ── 매장 이슈 모달 ── */
function openStoreIssues(storeName){
  issueTargetStore=storeName;
  issueFilter="all";
  document.getElementById("issueNewForm").style.display="none";
  renderIssuePanel();
  document.getElementById("issueOverlay").classList.add("show");
}
function closeStoreIssues(){
  document.getElementById("issueOverlay").classList.remove("show");
}
function setIssueFilter(f){issueFilter=f;renderIssuePanel();}
function issuesForTargetStore(){
  return STORE_ISSUES.filter(x=>x.store===issueTargetStore)
    .sort((a,b)=>b.createdAt-a.createdAt);
}
function renderIssuePanel(){
  const s=storeInfo(issueTargetStore);
  document.getElementById("issueStoreTitle").textContent=issueTargetStore.replace(/백화점백화점/g,"백화점")+" · 이슈 관리";
  document.getElementById("issueStoreSub").textContent=`담당 ${s.owner||"미지정"} · 파트장 ${s.partLead||"미지정"}`;

  const all=issuesForTargetStore();
  const open=all.filter(x=>x.status!=="해결완료");
  const done=all.filter(x=>x.status==="해결완료");
  const tabs=[
    {key:"all",label:"전체",count:all.length},
    {key:"open",label:"미해결",count:open.length},
    {key:"done",label:"해결",count:done.length},
  ];
  document.getElementById("issueTabs").innerHTML=tabs.map(t=>
    `<span class="issue-tab ${issueFilter===t.key?"on":""}" onclick="setIssueFilter('${t.key}')">${t.label} ${t.count}</span>`
  ).join("");

  const list=issueFilter==="open"?open:issueFilter==="done"?done:all;
  const listEl=document.getElementById("issueList");
  if(!list.length){
    listEl.innerHTML=`<div class="issue-empty">등록된 이슈가 없습니다.</div>`;
    return;
  }
  listEl.innerHTML=list.map(x=>{
    const unresolved=x.status!=="해결완료";
    return`<div class="issue-card ${unresolved?"issue-card-open":"issue-card-done"}">
      <button class="issue-del" onclick="deleteIssue('${x.id}')" title="삭제">×</button>
      <div class="issue-card-top">
        <div class="issue-card-title">${esc(x.title)}</div>
        <span class="issue-status-badge ${unresolved?"warn":"ok"}">${unresolved?"미해결":"해결완료"}</span>
      </div>
      ${x.detail?`<div class="issue-card-detail">${esc(x.detail)}</div>`:""}
      <div class="issue-card-meta">${esc(x.reporter)} · ${fmtIssueDate(x.createdAt)} 등록${x.resolvedAt?` · ${fmtIssueDate(x.resolvedAt)} 해결`:""}</div>
      ${unresolved
        ? `<div class="issue-resolve-row">
             <input class="issue-resolve-input" id="resolve-${x.id}" placeholder="처리 내용을 입력하고 해결 처리...">
             <button class="btn btn-primary" style="font-size:11px;padding:7px 12px" onclick="resolveIssue('${x.id}')">해결 처리</button>
           </div>`
        : x.resolutionNote ? `<div class="issue-card-resolution"><b>처리 내용</b> ${esc(x.resolutionNote)}</div>` : ""}
    </div>`;
  }).join("");
}
function fmtIssueDate(ts){
  const d=new Date(ts);
  return`${d.getMonth()+1}/${d.getDate()}`;
}
function showNewIssueForm(){
  document.getElementById("issueTitleInput").value="";
  document.getElementById("issueDetailInput").value="";
  document.getElementById("issueNewForm").style.display="flex";
  document.getElementById("issueTitleInput").focus();
}
function cancelNewIssue(){
  document.getElementById("issueNewForm").style.display="none";
}
function submitNewIssue(){
  const title=document.getElementById("issueTitleInput").value.trim();
  if(!title){alert("이슈 제목을 입력해 주세요.");return;}
  const detail=document.getElementById("issueDetailInput").value.trim();
  STORE_ISSUES.push({
    id:issueUid(),store:issueTargetStore,title,detail,
    status:"미해결",reporter:me,createdAt:Date.now(),resolvedAt:null,resolutionNote:"",
  });
  persistIssues();
  cancelNewIssue();
  renderIssuePanel();
  if(activeTab==="stores")renderStoresDashboard();
}
function resolveIssue(id){
  const x=STORE_ISSUES.find(i=>i.id===id);
  if(!x)return;
  const note=(document.getElementById("resolve-"+id)?.value||"").trim();
  x.status="해결완료";
  x.resolutionNote=note;
  x.resolvedAt=Date.now();
  persistIssues();
  renderIssuePanel();
  if(activeTab==="stores")renderStoresDashboard();
}
function deleteIssue(id){
  if(!confirm("이 이슈를 삭제할까요?"))return;
  STORE_ISSUES=STORE_ISSUES.filter(i=>i.id!==id);
  persistIssues();
  renderIssuePanel();
  if(activeTab==="stores")renderStoresDashboard();
}

/* ── 설정 모달 ── */
const AVATAR_ICONS=["🦁","🐯","🐰","🐻","🐼","🦊","🐨","🐧","🐬","🦉","🐝","🌟","🔥","🍀","💎","🚀"];
let iconDraft=[];
function openSettings(){
  iconDraft=MEMBERS.map(m=>m.icon||"");
  const grid=document.getElementById("settingsGrid");
  grid.innerHTML=MEMBERS.map((m,i)=>`
    <div class="member-slot">
      <div class="member-slot-top">
        <span class="av av-md" id="set-av-${i}" style="background:${m.color}">${avatarGlyph(m.name)}</span>
        <div class="slot-info">
          <div class="slot-role">${i===0?"그룹장":"팀원 "+i}</div>
          <input id="set-nm-${i}" value="${esc(m.name)}" placeholder="${DEFAULT_MEMBERS[i].name}"
            oninput="previewAvatar(${i},this.value)">
        </div>
      </div>
      <div class="icon-picker" id="icon-picker-${i}">
        <button type="button" class="icon-opt ${!m.icon?"on":""}" data-icon="" onclick="pickIcon(${i},'')">Aa</button>
        ${AVATAR_ICONS.map(ic=>`<button type="button" class="icon-opt ${m.icon===ic?"on":""}" data-icon="${ic}" onclick="pickIcon(${i},'${ic}')">${ic}</button>`).join("")}
      </div>
    </div>`).join("");
  document.getElementById("settingsOverlay").classList.add("show");
}
function previewAvatar(i,val){
  const av=document.getElementById("set-av-"+i);
  const ic=iconDraft[i];
  if(av)av.textContent=ic||(val.trim()||DEFAULT_MEMBERS[i].name).slice(0,2);
}
function pickIcon(i,ic){
  iconDraft[i]=ic;
  const picker=document.getElementById("icon-picker-"+i);
  if(picker)picker.querySelectorAll(".icon-opt").forEach(b=>b.classList.toggle("on",b.dataset.icon===ic));
  const nameVal=document.getElementById("set-nm-"+i)?.value||"";
  previewAvatar(i,nameVal);
}
function closeSettings(){document.getElementById("settingsOverlay").classList.remove("show");}
function saveNames(){
  const before=MEMBERS.map(m=>({...m}));
  MEMBERS.forEach((m,i)=>{
    const el=document.getElementById("set-nm-"+i);
    const newName=el?(el.value.trim()||DEFAULT_MEMBERS[i].name):m.name;
    if(newName!==m.name&&tasks.some(t=>t.assignee===m.name)){
      archiveMember(before[i],"이름 변경 · "+newName+"(으)로 교체");
    }
    m.name=newName;
    m.icon=iconDraft[i]||"";
  });
  const beforeNames=before.map(m=>m.name);
  tasks.forEach(t=>{
    const i=beforeNames.indexOf(t.assignee);
    if(i>-1)t.assignee=MEMBERS[i].name;
  });
  const meIdx=beforeNames.indexOf(me);
  if(meIdx>-1)me=MEMBERS[meIdx].name;
  if(!MEMBERS.find(m=>m.name===me))me=MEMBERS[0].name;
  localStorage.setItem(LS_ME,me);
  persistMembers();
  saveLocal();
  buildMe();render();closeSettings();
}

/* ── 백업 자료 모달 ── */
function openArchive(){
  const list=document.getElementById("archiveList");
  const arch=loadArchive();
  if(!arch.length){
    list.innerHTML=`<div class="issue-empty">보관된 백업 자료가 없습니다.<br><span style="font-size:11px">팀원 이름을 변경(교체)하면 이전 팀원의 업무 기록이 자동 저장됩니다.</span></div>`;
  }else{
    list.innerHTML=arch.map(a=>{
      const d=new Date(a.archivedAt);
      return`<div class="archive-card">
        <div class="archive-head" onclick="toggleArchiveDetail('${a.id}')">
          <span class="av av-md" style="background:${a.color}">${a.icon||initials(a.name)}</span>
          <div class="archive-info">
            <div class="archive-name">${esc(a.name)}</div>
            <div class="archive-meta">${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()} 보관 · ${esc(a.reason)} · 업무 ${a.taskCount}개 (완료 ${a.doneCount})</div>
          </div>
          <button class="archive-del" onclick="event.stopPropagation();deleteArchive('${a.id}')" title="삭제">×</button>
          <span class="archive-toggle">▾</span>
        </div>
        <div class="archive-detail" id="archive-detail-${a.id}" style="display:none">
          ${a.tasks.length?a.tasks.map(t=>`<div class="archive-task">
            <span class="archive-task-title">${esc(t.title)}</span>
            <span class="archive-task-meta">${t.status} · ${taskProgress(t)}%${t.due_date?" · 마감 "+t.due_date.slice(5):""}</span>
          </div>`).join(""):`<div class="archive-task"><span class="archive-task-title" style="color:var(--ink3)">보관된 업무 없음</span></div>`}
        </div>
      </div>`;
    }).join("");
  }
  document.getElementById("archiveOverlay").classList.add("show");
}
function closeArchive(){document.getElementById("archiveOverlay").classList.remove("show");}
function toggleArchiveDetail(id){
  const el=document.getElementById("archive-detail-"+id);
  if(el)el.style.display=el.style.display==="none"?"block":"none";
}
function deleteArchive(id){
  if(!confirm("이 백업 기록을 삭제할까요? 복구할 수 없습니다."))return;
  persistArchive(loadArchive().filter(a=>a.id!==id));
  openArchive();
}

/* ── 주간 알림 ── */
function weekKey(){
  const d=new Date();
  const monday=new Date(d);monday.setDate(d.getDate()-((d.getDay()+6)%7));
  return ymd(monday);
}
function checkWeeklyAlert(){
  const key=weekKey();
  if(localStorage.getItem(LS_WEEKALERT)===key)return;
  const open=tasks.filter(t=>t.status!=="완료");
  const overdue=open.filter(t=>daysLeft(t.due_date)!==null&&daysLeft(t.due_date)<0);
  const dueThisWeek=open.filter(t=>{const d=daysLeft(t.due_date);return d!==null&&d>=0&&d<=6;});
  const recheck=tasks.filter(t=>t.status==="완료"&&!t.rechecked);
  const rows=[
    {icon:"⏰",label:"지연 중인 업무",count:overdue.length,cls:overdue.length?"danger":""},
    {icon:"📅",label:"이번 주 마감 업무",count:dueThisWeek.length,cls:""},
    {icon:"🔄",label:"진행 중인 업무",count:open.filter(t=>t.status==="진행중").length,cls:""},
    {icon:"☑",label:"리체크 대기 (완료 후 미확인)",count:recheck.length,cls:recheck.length?"warn":""},
  ];
  document.getElementById("weeklyAlertBody").innerHTML=`
    <p style="font-size:13px;color:var(--ink2);margin-bottom:14px">이번 주 시작 전에 아래 현황을 확인해 주세요.</p>
    <div class="walert-rows">
      ${rows.map(r=>`<div class="walert-row ${r.cls}">
        <span class="walert-icon">${r.icon}</span>
        <span class="walert-label">${r.label}</span>
        <b class="walert-count">${r.count}건</b>
      </div>`).join("")}
    </div>
    ${overdue.length?`<div class="walert-list">
      ${overdue.slice(0,4).map(t=>`<div class="walert-task" onclick="closeWeeklyAlert();editTask('${t.id}')">
        <span>${esc(t.title)}</span><small>${esc(t.assignee)} · ${dueLabel(t.due_date)}</small>
      </div>`).join("")}
      ${overdue.length>4?`<div style="font-size:11px;color:var(--ink3);padding:4px 2px">외 ${overdue.length-4}건…</div>`:""}
    </div>`:""}`;
  document.getElementById("weeklyAlertOverlay").classList.add("show");
  localStorage.setItem(LS_WEEKALERT,key);
}
function closeWeeklyAlert(){document.getElementById("weeklyAlertOverlay").classList.remove("show");}

/* ── 인사이트 (진도율 해석) ── */
function insightHTML(stats,f){
  const lines=[];
  const total=f.length;
  if(!total)return"";
  const avg=Math.round(f.reduce((s,t)=>s+taskProgress(t),0)/total);
  const grade=avg>=70?{t:"양호",c:"var(--routine)"}:avg>=40?{t:"보통",c:"var(--impt)"}:{t:"주의",c:"var(--urgent)"};
  lines.push(`팀 평균 진행률은 <b style="color:${grade.c}">${avg}% (${grade.t})</b> 수준입니다.`);
  const withTasks=stats.filter(s=>s.total>0);
  if(withTasks.length>=2){
    const top=[...withTasks].sort((a,b)=>b.avg-a.avg)[0];
    const low=[...withTasks].sort((a,b)=>a.avg-b.avg)[0];
    if(top.member.name!==low.member.name){
      lines.push(`<b>${esc(top.member.name)}</b>님이 ${top.avg}%로 가장 앞서 있고, <b>${esc(low.member.name)}</b>님이 ${low.avg}%로 지원이 필요할 수 있습니다.`);
    }
  }
  const worstOver=[...stats].sort((a,b)=>b.overdue-a.overdue)[0];
  if(worstOver&&worstOver.overdue>0){
    lines.push(`지연 업무가 가장 많은 담당자는 <b style="color:var(--urgent)">${esc(worstOver.member.name)}(${worstOver.overdue}건)</b>입니다. 우선 처리가 필요합니다.`);
  }
  const noTask=stats.filter(s=>s.total===0);
  if(noTask.length)lines.push(`${noTask.map(s=>esc(s.member.name)).join(", ")}님은 배정된 업무가 없습니다. 업무 분배를 검토해 보세요.`);
  const recheck=f.filter(t=>t.status==="완료"&&!t.rechecked).length;
  if(recheck)lines.push(`완료 처리됐지만 아직 리체크되지 않은 업무가 <b>${recheck}건</b> 있습니다.`);
  return`<div class="insight-panel">
    <div class="dash-section-title">💡 업무 처리 인사이트</div>
    ${lines.map(l=>`<div class="insight-line">${l}</div>`).join("")}
  </div>`;
}

/* ── 탭 ── */
function switchTab(tab){
  activeTab=tab;
  document.querySelectorAll(".tab-btn").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));
  ["dashboard","team","daily","weekly","monthly","stores"].forEach(v=>{
    document.getElementById("view-"+v).style.display=v===tab?"block":"none";
  });
  render();
}

/* ── 필터 ── */
function buildFilters(){
  const wrap=document.getElementById("priFilters");
  wrap.innerHTML=`<span class="chip ${priFilter==="all"?"on":""}" onclick="setPri('all')">전체</span>`+
    PRIORITIES.map(p=>`<span class="chip ${priFilter===p.key?"on":""}" onclick="setPri('${p.key}')">${p.label}</span>`).join("");
}
function setPri(k){priFilter=k;buildFilters();render();}

/* ── 나는 selectbox ── */
function buildMe(){
  const saved=localStorage.getItem(LS_ME);if(saved&&MEMBERS.find(m=>m.name===saved))me=saved;
  const s=document.getElementById("meSelect");
  s.innerHTML=MEMBERS.map(m=>`<option ${m.name===me?"selected":""}>${esc(m.name)}</option>`).join("");
  s.onchange=()=>{
    me=s.value;
    localStorage.setItem(LS_ME,me);
    if(activeTab!=="dashboard")switchTab("dashboard");
    else render();
  };
}

/* ── ESC 닫기 ── */
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){closeModal();closeSettings();closeStoreSettings();closeStoreIssues();closeArchive();closeWeeklyAlert();}
});
document.getElementById("taskOverlay").addEventListener("click",e=>{if(e.target===e.currentTarget)closeModal();});
document.getElementById("settingsOverlay").addEventListener("click",e=>{if(e.target===e.currentTarget)closeSettings();});
document.getElementById("storeSettingsOverlay").addEventListener("click",e=>{if(e.target===e.currentTarget)closeStoreSettings();});
document.getElementById("issueOverlay").addEventListener("click",e=>{if(e.target===e.currentTarget)closeStoreIssues();});
document.getElementById("archiveOverlay").addEventListener("click",e=>{if(e.target===e.currentTarget)closeArchive();});
document.getElementById("weeklyAlertOverlay").addEventListener("click",e=>{if(e.target===e.currentTarget)closeWeeklyAlert();});

/* ── 초기화 ── */
(async function start(){
  const online=await DB.init();
  if(online){
    const d=await DB.loadAll();
    if(Array.isArray(d.members)&&d.members.length){
      MEMBERS=DEFAULT_MEMBERS.map((m,i)=>({
        name:(d.members[i]&&d.members[i].name)||m.name,
        color:(d.members[i]&&d.members[i].color)||m.color,
        icon:(d.members[i]&&d.members[i].icon)||"",
      }));
    }else{DB.save("members",MEMBERS);}
    if(Array.isArray(d.stores)){STORES=d.stores.map(normalizeStoreRow).filter(x=>x.name);}
    else{DB.save("stores",STORES);}
    if(Array.isArray(d.issues))STORE_ISSUES=d.issues;
    if(Array.isArray(d.archive))ARCHIVE=d.archive;
    if(Array.isArray(d.tasks))tasks=d.tasks;
    else{initData();DB.save("tasks",tasks);}
  }else{
    initData();
    try{const s=localStorage.getItem(LS_ARCHIVE);if(s){const a=JSON.parse(s);if(Array.isArray(a))ARCHIVE=a;}}catch(e){}
  }
  if(!MEMBERS.find(m=>m.name===me))me=MEMBERS[0].name;
  buildMe();buildFilters();
  viewDate=new Date();viewMonth=new Date();
  render();
  setTimeout(checkWeeklyAlert,600);
})();
</script>
